[workspace]
members = [
    "soldering/guest",
    "soldering/host",
]

resolver = "2"
[workspace.package]
version = "1.1.0"
edition = "2021"

[workspace.dependencies]
zkm-build = { git = "https://github.com/ProjectZKM/Ziren" }
zkm-sdk = { git = "https://github.com/ProjectZKM/Ziren" }
zkm-zkvm = { git = "https://github.com/ProjectZKM/Ziren" }
garbled-snark-verifier = { path = "../garbled-snark-verifier" }
bristol = { path = "../bristol" }
verifiable-circuit-babe = { path = "../verifiable-circuit-babe" }
verifiable-circuit-host = { path = "../verifiable-circuit-host" }

poseidon2 = { git = "https://github.com/ProjectZKM/poseidon2", branch = "dep/ziren-v2.0" }
bincode = "1.3.3"
sha2 = { version = "0.10.8" }

[profile.release]
opt-level = 3
[profile.bench]
opt-level = 3

[profile.fast]
inherits = "release"
debug = true
debug-assertions = true

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/ziren-patches/curve25519-dalek", branch = "patch-4.1.3" }
ecdsa-core = { git = "https://github.com/ziren-patches/signatures", package = "ecdsa", branch = "patch-ecdsa-0.16.9" }
rsa = { git = "https://github.com/ziren-patches/RustCrypto-RSA.git", branch = "patch-rsa-0.9.6" }
secp256k1 = { git = "https://github.com/ziren-patches/rust-secp256k1", branch = "patch-0.29.1" }
sha2 = { git = "https://github.com/ziren-patches/RustCrypto-hashes", branch = "patch-sha2-0.10.9" }
# patch-0.6.0 HEAD (0dfeeb1) pins zkm-lib to Ziren v1.2.7; aba7138 is the commit Ziren v2.0 itself locks.
substrate-bn = { git = "https://github.com/ziren-patches/bn", rev = "aba71380457d798039111e6cc0fdf2e0718c6766" }
k256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-k256-0.13.4" }
p256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-p256-0.13.2" }

# zkm-verifier depends on ziren-patches/bn directly by git, so [patch.crates-io] does not reach it.
[patch."https://github.com/ziren-patches/bn.git"]
substrate-bn = { git = "https://github.com/ziren-patches/bn", rev = "aba71380457d798039111e6cc0fdf2e0718c6766" }
